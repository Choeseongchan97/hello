name: 르냥뮤직스 APK 굽기

on:
  push:
    branches: [renyang-musics]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      - name: APK 굽기
        shell: bash
        run: bash ci/build.sh 2>&1 | tee ci.log

      - name: 실패하면 기록을 ci-log 브랜치에 남기기
        if: failure()
        run: |
          cp ci.log /tmp/ci.log || echo "no log" > /tmp/ci.log
          git config user.name "renyang-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          cp /tmp/ci.log log.txt
          git add -f log.txt
          git commit -m "build log #${{ github.run_number }}"
          git push -f origin ci-log

      - uses: actions/upload-artifact@v4
        with:
          name: renyang-musics-apk
          path: renyang-musics.apk

      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 르냥뮤직스 v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            🐱 르냥뮤직스 안드로이드 앱
            아래 renyang-musics.apk를 폰에서 눌러 받아서 설치하세요.
          files: renyang-musics.apk
